# Studio 15 LIGHT — hele stacken (norm «container»: ett repo, én stack).
# Arbeidsflate-containerne opprettes dynamisk av lobbyen og er ikke
# compose-tjenester; de kobles til nettet s15l-workspaces.
#
# Nettverksskillet (testfunn 22): lobbyen (docker-socket = styrende) ligger
# KUN på det interne nettet s15l-front som arbeidsflatene aldri når.
# Caddy står i begge nett og avviser all trafikk fra arbeidsflate-subnettet
# (se caddy/Caddyfile).

services:
  caddy:
    image: caddy:2.11.6-alpine
    container_name: s15l-caddy
    restart: unless-stopped
    ports:
      # Kun Tailscale + studio-LAN — ingen offentlig eksponering.
      # Tailnett: HTTPS (tailscale-sertifikat). LAN: HTTP på ravens statiske
      # LAN-IP (nmcli: manual), slik at nettbrett/PC-er på studio-wifien
      # slipper Tailscale. Samme portnummer utad (8100) for begge.
      - "100.65.19.39:8100:8100"
      # Wifi-en (KODE15) er et EGET nett med egen internettlinje — derfor
      # står raven også på wifi via wlo1 (nmcli-tilkobling «kode15-wifi»,
      # uten standardrute/DNS). Adressen er DHCP-tildelt; endrer den seg,
      # må linjene under OG A-posten lobby.studio15.cloud i deploi-dns
      # oppdateres. Standardporter (443/80) → adressen er bare
      # https://lobby.studio15.cloud — ingen port å huske.
      - "10.10.0.22:443:8102"
      - "10.10.0.22:80:8103"
      # Selvhelbredende legacy-adresse: 8100 levde kort på wifi-IP-en
      # (04.10) og sitter i nettlesernes autofullføring/bokmerker —
      # redirect i stedet for død port.
      - "10.10.0.22:8100:8103"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - s15l-caddy-data:/data
      - s15l-logs:/logs
    networks:
      - front
      - workspaces

  # STUN/TURN for webside-strømmen til tavla (WebRTC-pilot 05.10):
  # garantert vei for media også PC↔raven over Tailscale (ICE-kandidater
  # på tvers av nett kan feile — relé på raven er den varige løsningen).
  # host-nett: TURN trenger UDP-portspennet og ravens ekte adresser
  # (10.10.0.22 på wifi, 100.65.19.39 på tailnettet). Ikke offentlig:
  # raven har ingen offentlig IP, og Funnel rører ikke disse portene.
  coturn:
    image: coturn/coturn:4.7.0-alpine
    container_name: s15l-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --listening-port=3478
      - --listening-ip=10.10.0.22
      - --listening-ip=100.65.19.39
      - --relay-ip=10.10.0.22
      - --relay-ip=100.65.19.39
      - --fingerprint
      - --lt-cred-mech
      - --user=s15l:${TURN_PASSORD}
      - --realm=s15l
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200

  lobby:
    build: ./lobby
    image: studio15-light-lobby:v1
    container_name: s15l-lobby
    restart: unless-stopped
    env_file: .env
    environment:
      WORKSPACE_DRIVER: docker
      WORKSPACE_IMAGE: studio15-light-arbeidsflate:v2
      WORKSPACE_NETWORK: s15l-workspaces
      REPOS_VOLUME: s15l-repos
      # Brukes i absolutte adresser som gis VIDERE (Zoo-regelfilen i
      # arbeidsflatene). Studio-setene er på wifi-en → wifi-inngangen.
      PUBLIC_BASE: https://startside.studio15.cloud
      REGISTER_PATH: /data/register/programmer.yaml
      ACCESS_LOG: /logs/access.log
      # Overstyres kun i test av dvale/vekke (IDLE_MINUTES=1 ved oppstart)
      IDLE_MINUTES: "${IDLE_MINUTES:-45}"
      # Ravens egne adresser (tavla/kiosken via ts.net, localhost, wifi-IP):
      # trafikk herfra teller aldri som aktivitet i dvale-vakten (05.10).
      REAPER_IGNORE_IPS: "100.65.19.39,127.0.0.1,::1,10.10.0.22"
      # STUN/TURN for webside-strømmen (coturn over, host-nett): klientene
      # prøver direkte først; reléet er garantert vei over Tailscale.
      ICE_SERVERS: >-
        [{"urls":["stun:10.10.0.22:3478","stun:100.65.19.39:3478"]},
         {"urls":["turn:10.10.0.22:3478?transport=udp","turn:100.65.19.39:3478?transport=udp"],
          "username":"s15l","credential":"${TURN_PASSORD}"}]
      # Reconnect-vindu for presence før identiteten ryddes bort.
      # Overstyres kun i presence-smoketesten (PRESENCE_TIMEOUT_SECS=2).
      PRESENCE_TIMEOUT_SECS: "${PRESENCE_TIMEOUT_SECS:-120}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./register:/data/register
      # Vaktmester-nøkkelen (GITHUB_APP_KEY_FILE) — kun lest, aldri i git
      - ./certs:/certs:ro
      - s15l-repos:/repos
      - s15l-logs:/logs:ro
    networks:
      - front
      # Egress til api.github.com/github.com for vaktmesteren — s15l-ut har
      # ingen andre tjenester, så arbeidsflatene når fortsatt ikke lobbyen.
      - ut

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2
    container_name: s15l-litellm
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./proxy/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - workspaces

networks:
  # Styrende nett: kun caddy ↔ lobby. internal gir ingen rute ut.
  front:
    name: s15l-front
    internal: true
  # Egress-nett KUN for lobbyen (vaktmesterens GitHub-kall). Ingen
  # arbeidsflater her — nettskillet fra testfunn 22 står urørt.
  ut:
    name: s15l-ut
  # Arbeidsflate-nettet: caddy, litellm og arbeidsflatene. Fast subnett
  # slik at caddy-vakten kan blokkere på kilde-IP.
  workspaces:
    name: s15l-workspaces
    ipam:
      config:
        - subnet: 172.31.15.0/24

volumes:
  # Prosjektenes git-repoer (bare repos) — stand-in til vaktmester-appen
  # gir ekte GitHub-repoer. Deles mellom lobby og arbeidsflater.
  s15l-repos:
    name: s15l-repos
  s15l-logs:
    name: s15l-logs
  s15l-caddy-data:
    name: s15l-caddy-data
