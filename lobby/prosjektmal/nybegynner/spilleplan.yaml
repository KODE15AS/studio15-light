# Spilleplanen for nybegynner-malen (Jørn 05.10, testrapport 3).
# Siden 05.10 kveld eies planen av hjelperen alene (AGENTS.md): trinnene
# presenteres i chatten med todo-liste og svarknapper — oppgavefeltet på
# deltagerskjermen utgikk. (/api/spilleplan/nybegynner serverer fortsatt
# fila, men ingen leser den der nå.)
spill: Spillet i fire trinn
trinn:
  - nummer: 1
    tittel: Lag spillet
    tekst: >-
      Lag et enkelt spill for to spillere ved samme skjerm — for eksempel
      bondesjakk (tre på rad), SOS eller noe lignende. Beskriv for
      hjelperen hvordan du vil at brettet skal se ut, og prøv spillet på
      websiden over.
  - nummer: 2
    tittel: Spill mot en annen deltager
    tekst: >-
      Nå skal spillet utvides slik at du spiller mot en av de andre
      deltagerne her i Studio 15 Light — fra hver deres skjerm. Hvordan
      dere får det til, må du diskutere med hjelperen.
  - nummer: 3
    tittel: Tre spillere
    tekst: >-
      Utvid spillet til tre samtidige spillere. Er dere bare to, spiller
      en datarobot den tredje. Spillet skal vises på en god og intuitiv
      måte for alle tre.
  - nummer: 4
    tittel: Fire spillere
    tekst: >-
      Utvid spillet til fire samtidige spillere — dataroboter erstatter
      spillerne som mangler. Klarer dere å gjøre spillet lett å forstå og
      fint å se på for alle fire?
