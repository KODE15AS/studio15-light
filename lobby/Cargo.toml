[package]
name = "lobby"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bollard = "0.17"
tower-http = { version = "0.6", features = ["fs"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# Vaktmesteren (GitHub App): app-JWT + API-kall. rustls — ingen openssl
# i runtime-imaget.
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Per-arbeidsflate-hemmeligheter (git-token-stien)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Presence-laget (V2)
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
# Dokumentopplasting til innboks/ (ekspert-malen): tar-arkiv i minnet
# til PUT /containers/…/archive
tar = "0.4"

[profile.release]
strip = true
